<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <!-- Full window on every screen; no page zoom or scrolling, so pinches and drags go to the library -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <meta name="theme-color" content="#101216">
  <title>Network Anatomy</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101216; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #101216; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #e8e9ec; font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; background: #101216; }
    #loading .title { font-size: 20px; font-weight: 600; }
    #loading .sub { margin-top: 6px; font-size: 13px; color: #9aa3ad; }
    #loading .credit { position: absolute; bottom: 18px; font-size: 12px; color: #6f7883; text-align: center; padding: 0 16px; }
    #bar { width: 240px; height: 6px; margin-top: 18px; background: #2a2e36; border-radius: 3px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #33c7db; transition: width 0.2s; }
    #error { display: none; margin-top: 18px; max-width: 80%; color: #ff8f8f; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div class="title">Network Anatomy</div>
    <div class="sub">UK distribution cables, cut-outs and boards, taken apart</div>
    <div id="bar"><div id="fill"></div></div>
    <div class="credit">Application created by James Procter &copy; 2026 &middot; For education only</div>
    <div id="error"></div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebLibrary.loader.js";
    var config = {
      dataUrl: buildUrl + "/WebLibrary.data.unityweb",
      frameworkUrl: buildUrl + "/WebLibrary.framework.js.unityweb",
      codeUrl: buildUrl + "/WebLibrary.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Network Sim",
      productVersion: "4.0.1",
    };
    // Phones have very dense screens: cap the resolution so it stays smooth
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        var e = document.querySelector("#error");
        e.style.display = "block";
        e.textContent = "Sorry, Network Anatomy couldn't start in this browser: " + message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
